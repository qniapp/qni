name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Ruby for tutorial site
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.2
          bundler-cache: true
          working-directory: apps/tutorial

      - name: Build tutorial Pages site
        run: pnpm --dir apps/tutorial build:site

      # Publication dependency: this exact reviewed commit must be available on
      # qniapp/qni-tutorial-webgpu BEFORE an approved push of this repository.
      # Checkout must fail rather than silently substitute remote main.
      - name: Checkout pinned introduction tutorial
        uses: actions/checkout@v5
        with:
          repository: qniapp/qni-tutorial-webgpu
          ref: 9e9a72129fd69cd30394f66a8c00d63ae13029d3
          path: .introduction-tutorial

      - name: Read pinned WebGPU source
        id: webgpu
        run: echo "ref=$(tr -d '\r\n' < .introduction-tutorial/qni-webgpu.ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned WebGPU source
        uses: actions/checkout@v5
        with:
          repository: qniapp/qni-webgpu
          ref: ${{ steps.webgpu.outputs.ref }}
          path: .introduction-tutorial/.qni-webgpu-source

      - name: Setup tutorial pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
          # action-setup deletes dest; preserve pnpm 10's setup-node cache store.
          dest: ~/setup-pnpm-tutorial
          package_json_file: .introduction-tutorial/package.json

      # pnpm must not discover the legacy pnpm-workspace.yaml from either
      # the tutorial checkout or its nested WebGPU source checkout.
      - name: Move tutorial outside the legacy workspace
        id: tutorial
        run: |
          directory=$(mktemp -d "$RUNNER_TEMP/qni-introduction.XXXXXX")
          mv .introduction-tutorial "$directory/tutorial"
          echo "path=$directory/tutorial" >> "$GITHUB_OUTPUT"

      - name: Install pinned tutorial dependencies
        working-directory: ${{ steps.tutorial.outputs.path }}
        run: pnpm install --frozen-lockfile

      - name: Install prebuilt Trunk
        env:
          TRUNK_VERSION: 0.21.14
        run: |
          archive=trunk-x86_64-unknown-linux-gnu.tar.gz
          release="https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}"
          curl -fsSL "$release/$archive" -o "$RUNNER_TEMP/$archive"
          digest=$(curl -fsSL "$release/$archive.sha256" | awk '{print $1}')
          echo "$digest  $RUNNER_TEMP/$archive" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$HOME/.local/bin" trunk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build current pinned WebGPU assets
        working-directory: ${{ steps.tutorial.outputs.path }}
        env:
          # GITHUB_SHA belongs to this repository, not the nested engine checkout.
          QNI_SOURCE_COMMIT: ${{ steps.webgpu.outputs.ref }}
        run: bash scripts/fetch-qni-webgpu.sh .qni-webgpu-source

      - name: Build migration introduction
        working-directory: ${{ steps.tutorial.outputs.path }}
        env:
          QNI_TUTORIAL_MIGRATION: '1'
          QNI_EMBED_PREBUILT: '0'
          QNI_H_GATE_PREBUILT: '0'
        run: pnpm run typecheck && pnpm run build --outDir .astro/migration-dist

      - name: Test and compose introduction only
        env:
          INTRODUCTION_DIR: ${{ steps.tutorial.outputs.path }}
        run: |
          node --test scripts/compose-introduction.test.mjs scripts/check-pages-config.test.mjs
          node scripts/compose-introduction.mjs html "$INTRODUCTION_DIR/.astro/migration-dist"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
