<dialog
  id="legacy-toc-drawer"
  class="legacy-drawer"
  aria-label="目次"
  data-sidebar-target="menu"
  data-action="click->sidebar#backdrop close->sidebar#closed keydown->sidebar#trapFocus"
>
  <div class="legacy-drawer-panel" data-sidebar-target="body">
    <button
      type="button"
      class="legacy-toc-close"
      aria-label="目次を閉じる"
      autofocus
      data-action="click->sidebar#close"
    >
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path
          d="M6 18 18 6M6 6l12 12"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>
    {% include navigation.html %}
  </div>
</dialog>
