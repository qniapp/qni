<footer class="legacy-page-footer">
  <div class="legacy-page-footer-nav">
    {% if page.prev %}
    <a
      class="legacy-page-footer-link legacy-page-footer-prev"
      href="{{ page.prev_url }}"
      rel="prev"
    >
      {% include chevron_left.svg class="legacy-page-footer-chevron" %}
      <span class="legacy-page-footer-text">
        <span class="legacy-page-footer-label">前へ</span>
        <span class="legacy-page-footer-title">{{ page.prev }}</span>
      </span>
    </a>
    {% endif %} {% if page.next %}
    <a
      class="legacy-page-footer-link legacy-page-footer-next"
      href="{{ page.next_url }}"
      rel="next"
    >
      <span class="legacy-page-footer-text">
        <span class="legacy-page-footer-label">次へ</span>
        <span class="legacy-page-footer-title">{{ page.next }}</span>
      </span>
      {% include chevron_right.svg class="legacy-page-footer-chevron" %}
    </a>
    {% endif %}
  </div>
</footer>
